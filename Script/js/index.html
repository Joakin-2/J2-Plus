  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #09090b;
      --bg-card: #111116;
      --bg-card-hover: #17131f;
      --border: #27222f;
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --purple-light: #a78bfa;
      --text: #f4f4f5;
      --muted: #92929d;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top right,
          rgba(124, 58, 237, 0.13),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px;
    }

    /* =========================
       HUB
    ========================= */

    .video-hub {
      width: 100%;
      max-width: 1500px;
      margin: auto;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .title-area h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title-area p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 7px;
    }

    .add-button {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(139, 92, 246, .4);
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        var(--purple),
        var(--purple-dark)
      );
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow:
        0 0 25px rgba(139, 92, 246, .18);
      transition: .2s;
    }

    .add-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(139, 92, 246, .35);
    }

    /* =========================
       GRADE
    ========================= */

    .video-list {
      display: grid;

      /*
        4 vídeos por linha
      */
      grid-template-columns: repeat(4, minmax(0, 1fr));

      gap: 20px;
    }

    /* =========================
       CARD
    ========================= */

    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
    }

    .video-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(139, 92, 246, .55);

      box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        0 0 25px rgba(139,92,246,.08);
    }

    /* =========================
       CAPA
    ========================= */

    .video-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #18181b;
    }

    .video-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition:
        transform .4s,
        filter .4s;
    }

    .video-card:hover .video-cover img {
      transform: scale(1.05);
      filter: brightness(.65);
    }

    /* =========================
       PLAY
    ========================= */

    .play-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 25px;

      opacity: 0;

      transition: .25s;
    }

    .video-card:hover .play-overlay {
      opacity: 1;
    }

    .play-circle {
      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(139,92,246,.92);

      box-shadow:
        0 0 30px rgba(139,92,246,.5);
    }

    /* =========================
       INFORMAÇÕES
    ========================= */

    .video-info {
      padding: 15px;
    }

    .video-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);

      margin-bottom: 7px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-description {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;

      height: 39px;

      overflow: hidden;

      margin-bottom: 15px;
    }

    /* =========================
       AÇÕES
    ========================= */

    .video-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .watch-button {
      flex: 1;

      border: none;

      padding: 9px 12px;

      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-dark)
        );

      color: white;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .watch-button:hover {
      filter: brightness(1.15);
    }

    /* =========================
       OPÇÕES
    ========================= */

    .options {
      position: relative;
    }

    .options-button {
      height: 36px;

      border: 1px solid var(--border);

      background: #18181d;

      color: #aaa;

      padding: 0 11px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;
    }

    .options-button:hover {
      color: white;

      border-color:
        rgba(139,92,246,.5);
    }

    .menu {
      display: none;

      position: absolute;

      right: 0;
      bottom: 44px;

      width: 150px;

      background: #18181d;

      border: 1px solid var(--border);

      border-radius: 9px;

      box-shadow:
        0 15px 30px rgba(0,0,0,.5);

      overflow: hidden;

      z-index: 20;
    }

    .menu.active {
      display: block;
    }

    .menu button {
      width: 100%;

      border: none;

      background: transparent;

      color: #ddd;

      padding: 11px 13px;

      text-align: left;

      cursor: pointer;

      font-size: 13px;
    }

    .menu button:hover {
      background:
        rgba(139,92,246,.12);

      color: white;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    /* 3 por linha */

    @media (max-width: 1150px) {

      .video-list {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }

    /* 2 por linha */

    @media (max-width: 800px) {

      body {
        padding: 20px;
      }

      .video-list {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    /* 1 por linha */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .title-area h1 {
        font-size: 23px;
      }

      .video-list {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

    function carregarVideos() {

        card.className = "video-card";

        card.innerHTML = `

      );

    =====================================================
    COPIAR LINK
    =====================================================
    */

    function copiarLink(index) {

      navigator.clipboard.writeText(
        videos[index].video
      );

      alert("Link copiado!");

    }


    /*
    =====================================================
    MENU
    =====================================================
    */

    function toggleMenu(button) {

      const menu =
        button.nextElementSibling;

      document
        .querySelectorAll(".menu")
        .forEach(item => {

          if (item !== menu) {
            item.classList.remove("active");
          }

        });

      menu.classList.toggle("active");

    }


    /*

      ) {

        videos.splice(index, 1);

        carregarVideos();

        prompt("Descrição:");

        prompt("LINK do vídeo:");

      if (!video) return;


      videos.push({

        titulo,
        descricao,
        capa,
        video

      });


      carregarVideos();

    }
