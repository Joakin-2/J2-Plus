        .comemoracao {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #b690f9;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 16px;
    z-index: 1000;
    animation: aparecer 0.5s ease, desaparecer 0.5s ease 2.5s;
  }
  
  @keyframes aparecer {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }
  
  @keyframes desaparecer {
    from {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    to {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
    }
  }  


section button {
    grid-column: 1 / -1;
}

/* No celular, volta para uma coluna */
@media (max-width: 600px) {
    section {
        grid-template-columns: 1fr;
    }

    section button {
        grid-column: auto;
    }

        function verificarModalEspecial() {

    const hash = window.location.hash.replace("#", "");

    // Atualiza o título da página
    if (hash === "relatorio") {
        document.title = "Relatório Diário";
    } 
    else if (hash === "reflexoes") {
        document.title = "Reflexões";
    } 
    else {
        document.title = "O Conselho";
    }

    // Abre o modal correspondente
    if (hash === "relatorio" || hash === "reflexoes") {
        abrirModalEspecial(hash);
    } else {
        document.querySelectorAll(".modal-especial").forEach(modal => {
            modal.classList.remove("ativo");
        });
    }
}


function abrirModalEspecial(hash) {

    // Fecha os dois primeiro
    document.querySelectorAll(".modal-especial").forEach(modal => {
        modal.classList.remove("ativo");
    });

    // Abre o modal correspondente
    if (hash === "relatorio") {
        document.getElementById("modal-relatorio").classList.add("ativo");
    }

    else if (hash === "reflexoes") {
        document.getElementById("modal-reflexoes").classList.add("ativo");
    }
}


// Fecha os modais
function fecharModalEspecial() {

    document.querySelectorAll(".modal-especial").forEach(modal => {
        modal.classList.remove("ativo");
    });

    // Remove o hash da URL
    history.pushState(
        "",
        document.title,
        window.location.pathname + window.location.search
    );

    // Atualiza o título para o padrão
    document.title = "O Conselho";
}


// Quando a página carrega
window.addEventListener("load", () => {
    verificarModalEspecial();
});


// Quando o # muda
window.addEventListener("hashchange", () => {
    verificarModalEspecial();
});

        let xpTotal = 0; // Definir o XP total globalmente

function calcularXP() {
    xpTotal = 0; // Resetar o XP total antes de recalcular
    const respostas = [
        'objetivosAnoNovo',
        'aprendizadosAno',
        'desafiosSuperados',
        'momentosFelizes',
        'metasNaoAlcancadas',
        'metasNaoAlcancadas2',
        'agradecimentos'
    ];

    respostas.forEach(id => {
        const resposta = document.getElementById(id).value.trim();
        if (resposta.length > 5) { 
            xpTotal += 10; 
        }
    });

    document.getElementById('xp').textContent = `XP: ${xpTotal}`;
    ganharXp(xpTotal); // Atualizar o XP total no sistema de níveis
}

        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text('Questionário de Fim de Ano', 10, 20);
            doc.text(`XP Final: ${xpTotal}`, 10, 40);

            const respostas = [
                { pergunta: "Quais são seus principais objetivos para o próximo ano?", resposta: document.getElementById('objetivosAnoNovo').value },
                { pergunta: "Quais foram os principais aprendizados deste ano?", resposta: document.getElementById('aprendizadosAno').value },
                { pergunta: "Quais desafios você superou neste ano?", resposta: document.getElementById('desafiosSuperados').value },
                { pergunta: "Quais foram os momentos mais felizes do ano?", resposta: document.getElementById('momentosFelizes').value },
                { pergunta: "Existem metas que não foram alcançadas?", resposta: document.getElementById('metasNaoAlcancadas').value },
                { pergunta: "O que você pode fazer para alcançá-las?", resposta: document.getElementById('metasNaoAlcancadas2').value },
                { pergunta: "O que você agradece mais neste ano?", resposta: document.getElementById('agradecimentos').value }
            ];

            let y = 60;
            respostas.forEach(({ pergunta, resposta }) => {
                doc.setFontSize(12);
                doc.text(`${pergunta}`, 10, y);
                y += 10;
                doc.text(`Resposta: ${resposta}`, 10, y);
                y += 20;
            });

            doc.save(`Reflexão de Fim de Ano (${obterDataAtual()}).pdf`);
        }

// Função para adicionar XP
function ganharXp(xp) {
  const perfil = perfis[perfilAtivo];
  perfil.xp += xp;

  const xpNecessario = 100 * perfil.nivel * perfil.nivel;
  if (perfil.xp >= xpNecessario) {
    perfil.xp -= xpNecessario;
    perfil.nivel++;
    mostrarComemoracao(`Parabéns, ${perfil.nome} subiu para o nível ${perfil.nivel}!`);
  }

  localStorage.setItem("xp" + perfilAtivo, perfil.xp);
  localStorage.setItem("nivel" + perfilAtivo, perfil.nivel);
  atualizarInterface();
}

// Função para mostrar uma mensagem comemorativa
function mostrarComemoracao(xp) {
    const mensagem = `Você ganhou ${xp} XP!`;
    const divComemoracao = document.createElement('div');
    divComemoracao.classList.add('comemoracao');
    divComemoracao.textContent = mensagem;
    document.body.appendChild(divComemoracao);

    // Remove a mensagem após 3 segundos
    setTimeout(() => {
        divComemoracao.remove();
    }, 3000);
}
        
        function obterDataAtual() {
            const data = new Date();
            const dia = data.getDate().toString().padStart(2, '0');
            const mes = (data.getMonth() + 1).toString().padStart(2, '0');
            const ano = data.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

                const horario = `${horas}:${minutos}:${segundos}`;
                relogioElement.textContent = horario;
            }
        }

        function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'pt', 'a4');

    // Definir cores para o tema escuro
    const corFundo = [30, 30, 30]; // Cor de fundo escura (rgb)
    const corTexto = [255, 255, 255]; // Cor do texto clara (rgb)
    const corRespostaCorreta = [0, 255, 0]; // Verde para respostas corretas
    const corRespostaIncorreta = [255, 0, 0]; // Vermelho para respostas incorretas

    // Preencher o fundo com a cor escura
    doc.setFillColor(...corFundo);
    doc.rect(0, 0, doc.internal.pageSize.width, doc.internal.pageSize.height, 'F');

    // Adicionar título e data
    doc.setTextColor(...corTexto);
    doc.setFontSize(16);
    doc.text('Resultado do Conselho', 10, 20);
    doc.text(`Data: ${obterDataAtual()}`, 10, 40);

    // Adicionar perguntas e respostas
    const perguntas = [
        {
            pergunta: "Você escovou seus dentes quantas vezes por dia?",
            respostaUsuario: document.getElementById('escovouDentes').value,
            // condição: 4 ou mais é certo
            acertou: function() { return parseInt(this.respostaUsuario) >= 4; }
        },
        {
            pergunta: "Você ensaiou quanto tempo?",
            respostaUsuario: document.getElementById('tempoEnsaio').value,
            // condição: 10 minutos ou mais é certo
            acertou: function() { return parseInt(this.respostaUsuario) >= 10; }
        },
        { pergunta: "Você treinou quantos dias?", respostaCorreta: "5", respostaUsuario: document.getElementById('treinoDias').value },
        { pergunta: "Você foi em todos os Cultos da Semana?", respostaCorreta: "sim", respostaUsuario: document.getElementById('cultosSemana').value },
        { pergunta: "Você fez os devocionais todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('devocionaisDiarios').value },
        { pergunta: "Você deu o seu melhor todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('deuOMelhor').value },
        { pergunta: "Você fez o vácuo todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('fezVacuo').value },
        { pergunta: "Você se alongou todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('alongou').value },
        { pergunta: "Você correu ou vai correr hoje?", respostaCorreta: "sim", respostaUsuario: document.getElementById('correuHoje').value },
        { pergunta: "Você bebeu 4 litros de água todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('bebeuAgua').value },
        { pergunta: "Você fez refeições nutritivas todos os dias?", respostaCorreta: "sim", respostaUsuario: document.getElementById('refeicoes').value },
        { pergunta: "Você cuidou da sua pele?", respostaCorreta: "sim", respostaUsuario: document.getElementById('cuidouDaPele').value },
        { pergunta: "Você tomou banhos rápidos?", respostaCorreta: "sim", respostaUsuario: document.getElementById('banhosRapidos').value },
        { pergunta: "Você ajudou em casa?", respostaCorreta: "sim", respostaUsuario: document.getElementById('ajudaCasa').value },
        { pergunta: "Você foi produtivo?", respostaCorreta: "sim", respostaUsuario: document.getElementById('foiProdutivo').value },
        { pergunta: "Você teve momentos de leitura?", respostaCorreta: "sim", respostaUsuario: document.getElementById('ler').value },
        { pergunta: "Você viu conteúdos relevantes?", respostaCorreta: "sim", respostaUsuario: document.getElementById('conteudosRelevantes').value },
        { pergunta: "Você se entreteve com coisas boas?", respostaCorreta: "sim", respostaUsuario: document.getElementById('bonsEntretenimentos').value },
        { pergunta: "Você leu a Bíblia?", respostaCorreta: "sim", respostaUsuario: document.getElementById('leuBiblia').value },
        { pergunta: "Você xingou?", respostaCorreta: "nao", respostaUsuario: document.getElementById('xingou').value }
    ];

    let y = 60; // Posição vertical inicial
    let pontuacao = 0;
    const totalPerguntas = perguntas.length;

    perguntas.forEach((item, index) => {
    doc.setFontSize(12);
    doc.setTextColor(...corTexto);
    doc.text(`Pergunta ${index + 1}: ${item.pergunta}`, 40, y);
    y += 18; // subir um pouco no Y para a resposta

    const certo = item.acertou ? item.acertou() : (item.respostaUsuario.trim().toLowerCase() === item.respostaCorreta.toLowerCase());
    const corResposta = certo ? corRespostaCorreta : corRespostaIncorreta;
    doc.setTextColor(...corResposta);
    doc.text(`Sua Resposta: ${item.respostaUsuario}`, 40, y);
    y += 25; // mais espaço para a próxima pergunta
    doc.setTextColor(...corTexto);

    if (certo) {
    pontuacao++;
    ganharXp(10); // ou xpTotal += 10, dependendo da sua lógica
}

    if (y > 750) { // quebra de página
        doc.addPage();
        doc.setFillColor(...corFundo);
        doc.rect(0, 0, doc.internal.pageSize.width, doc.internal.pageSize.height, 'F');
        y = 30;
    }
});

    // Classificação da semana
    const resultadoSemana = classificarSemana(pontuacao, totalPerguntas - pontuacao);

    doc.setFontSize(16);
    doc.setTextColor(...corTexto);
    doc.text(`Pontuação: ${pontuacao} de ${totalPerguntas}`, 10, y);
    y += 20;
    doc.text(`Classificação: ${resultadoSemana}`, 10, y);
    
    doc.save(`Conselho (${obterDataAtual()}).pdf`);
}

        function classificarSemana(positivas, negativas) {
            if (positivas === 0) {
                return 'Semana Ridícula';
            } else if (negativas === 0) {
                return 'Semana de Lendas';
            } else if (positivas > negativas) {
                return 'Semana de Ouro';
            } else if (negativas > positivas) {
                return 'Semana Medíocre';
            } else {
                return 'Semana Morda';
            }
        }

        function exibirMensagemNaoSabado() {
            if (!document.querySelector('.mensagem')) {
                const mensagemElement = document.createElement('div');
                mensagemElement.className = 'mensagem';
                mensagemElement.textContent = "Este questionário só está disponível aos sábados.";
                document.querySelector('.container').appendChild(mensagemElement);
            }
        }

        // Atualiza o relógio a cada segundo
        setInterval(atualizarRelogio, 1000);

        // Exibe o questionário se for sábado
        exibirQuestionario();
    </script>
